# Blueprint de Render: New → Blueprint → conecta este repositorio.
# Plan gratis: el servicio "duerme" tras 15 min sin visitas y despierta en ~1 min.
# Los datos viven en Turso (SQLite en la nube), así que no se pierden al reiniciar.
services:
  - type: web
    name: factura-ia-jsonserrano
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm install && npm run build
    startCommand: npx tsx server/index.ts
    healthCheckPath: /api/salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: TURSO_DATABASE_URL
        sync: false # libsql://factura-ia-<usuario>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false # opcional: activa la IA con Claude para todos los visitantes
      - key: LIMITE_IA
        value: "30"
      # Botón "Escríbeme": tu número vive SOLO aquí (nunca en el código ni en la página)
      - key: CONTACTO_WHATSAPP
        sync: false # 57XXXXXXXXXX
      # Datos del negocio que no van en el código público
      - key: EMISOR_NOMBRE
        value: Connexa S.A.S.
      - key: EMISOR_EMAIL
        sync: false # ej. tu correo de contacto
      - key: CONTACTO_NOMBRE
        value: Javier
      # Opcional: Cloudflare Turnstile (verificación humana extra, gratis)
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET
        sync: false
      # Correo de facturas
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false # correo verificado como remitente en Brevo
